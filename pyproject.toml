[project]
name = "fiel"
version = "0.1.0"
description = "Corpus-agnostic grounding-reliability eval harness: measures whether an LLM-as-judge reliably catches ungrounded answers. Demonstrated on SEC filings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Humberto Mangino", email = "hmangino@gmail.com" }]
keywords = ["llm", "evals", "llm-as-judge", "grounding", "faithfulness", "inspect-ai", "rag"]

dependencies = [
    # Eval framework (pinned; API verified against this version)
    "inspect-ai==0.3.259",
    # Judge model providers (used via Inspect's provider layer)
    "anthropic>=0.40",
    "openai>=1.50",
    # Data + stats
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    # Schema + config
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # EDGAR fetching + HTML-to-text extraction
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
